<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Migración JSON -> Supabase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body {
            padding: 20px;
            background: #f8f9fa;
        }

        .log-box {
            background: #222;
            color: #0f0;
            font-family: monospace;
            padding: 10px;
            height: 400px;
            overflow-y: auto;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Migrador BasketKids (JSON)</h1>
        <p>Esta herramienta migra datos desde un archivo JSON (exportado de Firebase) a Supabase.</p>

        <div class="card mb-3">
            <div class="card-body">
                <h5>Migración desde JSON</h5>
                <input type="file" id="jsonFile" class="form-control mb-2" accept=".json">
                <button id="btnStartJson" class="btn btn-warning" disabled>Iniciar Migración JSON</button>
                <small class="text-muted d-block">Sube el 'export.json' de Firebase Database.</small>

                <div class="form-check mt-2">
                    <input class="form-check-input" type="checkbox" id="checkDryRun">
                    <label class="form-check-label" for="checkDryRun">Simulacro (No escribir en Supabase)</label>
                </div>
            </div>
        </div>

        <div class="log-box" id="logBox">Esperando archivo...</div>
    </div>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Configs -->
    <script src="js/supabase-config.js"></script>

    <script>
        // Init Supabase
        // window.supabaseClient is set in supabase-config.js
        const sb = window.supabaseClient;

        const logBox = document.getElementById('logBox');
        function log(msg, type = 'info') {
            const div = document.createElement('div');
            div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            if (type === 'error') div.style.color = 'red';
            else if (type === 'success') div.style.color = '#0ff';
            logBox.appendChild(div);
            logBox.scrollTop = logBox.scrollHeight;
        }

        // JSON MIGRATION
        const btnStartJson = document.getElementById('btnStartJson');
        const jsonFileInput = document.getElementById('jsonFile');

        jsonFileInput.addEventListener('change', () => {
            btnStartJson.disabled = !jsonFileInput.files.length;
        });

        btnStartJson.onclick = async () => {
            const dryRun = document.getElementById('checkDryRun').checked;
            const file = jsonFileInput.files[0];
            if (!file) return;

            btnStartJson.disabled = true;
            log(`Leyendo archivo JSON...`);

            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    log(`JSON leído. Tamaño: ${(file.size / 1024 / 1024).toFixed(2)} MB.`);

                    // Look for 'usuarios' node
                    const usuarios = data.usuarios || {};
                    const uids = Object.keys(usuarios);
                    log(`Encontrados ${uids.length} usuarios para migrar.`);

                    // Migrate Contact Messages
                    if (data.messages) {
                        await migrateMessages(data.messages, dryRun);
                    }

                    let count = 0;
                    for (const uid of uids) {
                        const userData = usuarios[uid];

                        const userObj = {
                            uid: uid,
                            email: userData.profile?.email || null, // Check usage in profile.js
                            displayName: userData.profile?.displayName || 'Usuario',
                            photoURL: userData.profile?.photoURL || null,
                            ...userData
                        };

                        log(`Migrando usuario ${count + 1}/${uids.length}: ${uid}`);
                        await migrateUserRecursive(userObj, dryRun);
                        count++;
                    }

                    log(`Migración masiva completada. ${count} usuarios procesados.`, 'success');

                } catch (err) {
                    log("Error parseando JSON o migrando: " + err.message, 'error');
                    console.error(err);
                } finally {
                    btnStartJson.disabled = false;
                }
            };
            reader.readAsText(file);
        };

        async function migrateUserRecursive(userObj, dryRun) {
            // 1. Profile
            await migrateProfile(userObj, dryRun);

            // 2. Teams
            if (userObj.equipos) {
                const teams = userObj.equipos;
                const teamIds = Object.keys(teams);
                for (const teamId of teamIds) {
                    const teamData = teams[teamId];
                    await migrateTeam(userObj.uid, teamId, teamData, dryRun);
                }
            }
        }

        async function migrateAvatarConfig(config, dryRun) {
            if (!config || dryRun) return null;

            const payload = {
                skin_color: config.skinColor,
                top: config.top,
                hair_color: config.hairColor,
                hat_color: config.hatColor,
                facial_hair_type: config.facialHairType,
                facial_hair_color: config.facialHairColor,
                eyes: config.eyes,
                eyebrows: config.eyebrows,
                mouth: config.mouth,
                accessories_type: config.accessoriesType,
                accessories_color: config.accessoriesColor,
                clothing: config.clothing,
                clothes_color: config.clothesColor,
                clothing_graphic: config.clothingGraphic
            };

            const { data, error } = await sb.from('avatar_configs').insert(payload).select('id').single();
            if (error) {
                log("Error insertando avatar: " + error.message, 'error');
                return null;
            }
            return data.id;
        }

        async function migrateProfile(user, dryRun) {
            log(`Migrando perfil... ${user.uid}`);

            let isAdmin = false;
            if (user.profile && user.profile.admin === true) {
                isAdmin = true;
            } else {
                if (user.profile?.admin === true) isAdmin = true;
            }

            if (dryRun) {
                log(`Perfil: ${user.email} (Admin: ${isAdmin})`);
                return;
            }

            // Avatar Config
            let avatarConfigId = null;
            const avatarParams = user.avatarConfig || user.profile?.avatarConfig;
            if (avatarParams) {
                avatarConfigId = await migrateAvatarConfig(avatarParams, dryRun);
            }

            const { error } = await sb.from('profiles').upsert({
                id: user.uid,
                email: user.email || null,
                display_name: user.displayName || user.profile?.displayName || 'Usuario',
                photo_url: user.photoURL || user.profile?.photoURL || null,
                is_admin: isAdmin,
                avatar_config_id: avatarConfigId,
                updated_at: new Date()
            }, { onConflict: 'id' });

            if (error) throw new Error("Error perfil Supabase: " + error.message);
            log("Perfil migrado OK.");
        }

        async function migrateTeam(userId, teamId, teamData, dryRun) {
            log(`Migrando equipo: ${teamData.nombre || 'Sin nombre'} (${teamId})`);

            let sbTeamId = null;
            if (!dryRun) {
                const { data, error } = await sb.from('teams').insert({
                    owner_id: userId,
                    name: teamData.nombre || 'Equipo Sin Nombre',
                    coach: teamData.entrenador || null,
                    club: teamData.club || null,
                    category: teamData.categoria || null,
                    city: teamData.ciudad || null,
                    color: teamData.color || null
                }).select().single();

                if (error) {
                    log(`Error creando equipo: ${error.message}`, 'error');
                    return;
                }
                sbTeamId = data.id;
                log(`-> Equipo creado en SB con ID: ${sbTeamId}`);
            } else {
                sbTeamId = 'dry-run-id';
            }

            // Players
            const playerMap = new Map(); // FirebaseId -> SupabaseId
            if (teamData.jugadores) {
                await migratePlayers(sbTeamId, teamData.jugadores, dryRun, playerMap);
            }

            // Competitions
            if (teamData.competiciones) {
                await migrateCompetitions(userId, sbTeamId, teamData.competiciones, dryRun, playerMap);
            }
        }

        async function migratePlayers(sbTeamId, playersData, dryRun, playerMap) {
            const playerIds = Object.keys(playersData);
            log(`-> Migrando ${playerIds.length} jugadores...`);

            for (const fid of playerIds) {
                const p = playersData[fid];
                let avatarId = null;
                if (!dryRun && p.avatarConfig) {
                    avatarId = await migrateAvatarConfig(p.avatarConfig, dryRun);
                }

                if (!dryRun) {
                    const { data, error } = await sb.from('players').insert({
                        team_id: sbTeamId,
                        name: p.nombre,
                        number: p.dorsal,
                        position: p.posicion || null,
                        height: p.altura || null,
                        weight: p.peso || null,
                        birth_date: p.fechaNacimiento || null,
                        avatar_config_id: avatarId
                    }).select().single();

                    if (error) log(`Error jugadores: ${error.message}`, 'error');
                    else {
                        if (data) playerMap.set(fid, data.id);
                    }
                }
            }
            if (!dryRun) log(`-> Jugadores insertados.`);
        }

        async function migrateCompetitions(userId, sbTeamId, compsData, dryRun, playerMap) {
            const compIds = Object.keys(compsData);
            log(`-> Migrando ${compIds.length} competiciones...`);

            for (const compFid of compIds) {
                const comp = compsData[compFid];
                let sbCompId = 'dry-run-comp-id';

                if (!dryRun) {
                    const { data, error } = await sb.from('competitions').insert({
                        team_id: sbTeamId,
                        name: comp.nombre || 'Competición'
                    }).select().single();

                    if (error) { log(`Error competición: ${error.message}`, 'error'); continue; }
                    sbCompId = data.id;
                }

                // Rivals
                const rivalsMap = new Map();
                if (comp.rivales) {
                    await migrateRivals(sbCompId, comp.rivales, rivalsMap, dryRun);
                }

                // Matches
                if (comp.partidos) {
                    await migrateMatches(userId, sbTeamId, sbCompId, comp.partidos, rivalsMap, dryRun, playerMap);
                }
            }
        }

        async function migrateRivals(sbCompId, rivalsData, rivalsMap, dryRun) {
            const rivalIds = Object.keys(rivalsData);
            log(`--> Migrando ${rivalIds.length} rivales...`);
            for (const rId of rivalIds) {
                const r = rivalsData[rId];
                if (!dryRun) {
                    const { data, error } = await sb.from('rivals').insert({
                        competition_id: sbCompId,
                        name: r.nombre
                    }).select().single();
                    if (!error) rivalsMap.set(r.nombre, data.id);
                    rivalsMap.set(rId, data.id);
                }
            }
        }

        async function migrateMatches(userId, sbTeamId, sbCompId, matchesData, rivalsMap, dryRun, playerMap) {
            const matchIds = Object.keys(matchesData);
            log(`--> Migrando ${matchIds.length} partidos...`);

            for (const mId of matchIds) {
                const m = matchesData[mId];
                let sbMatchId = 'dry-run-match-id';

                let matchDate = null;
                if (m.fecha) {
                    matchDate = m.fecha;
                    if (m.hora) matchDate += 'T' + m.hora;
                }
                // Fallback if date is in m.fechaHora (old format?) or m.date
                if (!matchDate && m.fechaHora) matchDate = m.fechaHora;

                let rivalId = null;
                if (m.rivalId && rivalsMap.has(m.rivalId)) {
                    rivalId = rivalsMap.get(m.rivalId);
                }

                if (!dryRun) {
                    const { data, error } = await sb.from('matches').insert({
                        competition_id: sbCompId,
                        team_id: sbTeamId,
                        rival_id: rivalId,
                        rival_name: m.nombreRival || m.rival || 'Rival',
                        date: matchDate,
                        location: m.lugar || m.pabellon,
                        is_local: (m.esLocal !== false),
                        state: m.estado || 'scheduled',
                        match_config: m.configuracion || '4x10',
                        team_score: m.puntosEquipo || 0,
                        rival_score: m.puntosRival || 0,
                        chronicle: m.cronica || null,
                        live_state: m
                    }).select().single();

                    if (error) { log(`Error partido ${mId}: ${error.message}`, 'error'); continue; }
                    sbMatchId = data.id;
                }

                // Migrate Match Stats (New Relational Table)
                await migrateMatchStats(sbMatchId, m, dryRun, playerMap);

                if (m.eventos) {
                    await migrateEvents(sbMatchId, m.eventos, dryRun, playerMap);
                }
            }
        }

        async function migrateMatchStats(sbMatchId, matchData, dryRun, playerMap) {
            if (dryRun) return;

            const statsMap = matchData.estadisticasJugadores || {};
            const roster = matchData.convocados || {};

            const rosterIds = Object.keys(roster);
            const statsPayload = [];

            for (const fid of rosterIds) {
                // Resolve Supabase Player ID
                if (!playerMap || !playerMap.has(fid)) {
                    // It's possible player was deleted or not migrated?
                    continue;
                }
                const sbPlayerId = playerMap.get(fid);

                const s = statsMap[fid] || {};
                const playerInfo = roster[fid] || {};

                statsPayload.push({
                    match_id: sbMatchId,
                    player_id: sbPlayerId,
                    dorsal: playerInfo.dorsal || null,
                    points: s.puntos || 0,
                    rebounds: s.rebotes || 0,
                    asistencias: s.asistencias || 0,
                    robos: s.robos || 0,
                    tapones: s.tapones || 0,
                    faltas: s.faltas || 0,
                    valoracion: 0
                });
            }

            if (statsPayload.length > 0) {
                const { error } = await sb.from('match_player_stats').insert(statsPayload);
                if (error) log(`Error stats partido: ${error.message}`, 'error');
            }
        }

        async function migrateEvents(sbMatchId, eventsData, dryRun, playerMap) {
            if (dryRun) return;
            // EVENTS are usually an array in JSON or object with keys?
            // Firebase uses object keys usually.
            const eventKeys = Object.keys(eventsData);
            const eventsPayload = [];

            for (const k of eventKeys) {
                const ev = eventsData[k];
                // Resolve Player UUID
                let playerId = null;
                if (ev.jugadorId && playerMap && playerMap.has(ev.jugadorId)) {
                    playerId = playerMap.get(ev.jugadorId);
                }

                eventsPayload.push({
                    match_id: sbMatchId,
                    event_type_id: ev.tipo,
                    player_id: playerId,
                    quarter: ev.cuarto || 1,
                    timestamp: ev.tiempoSegundos || 0,
                    value: ev.cantidad || (ev.valor || 0),
                    properties: ev
                });
            }

            if (eventsPayload.length > 0) {
                const { error } = await sb.from('match_events').insert(eventsPayload);
                if (error) log(`Error insertando eventos partido: ${error.message}`, 'error');
            }
        }

        async function migrateMessages(messagesData, dryRun) {
            if (!messagesData) return;
            const messageIds = Object.keys(messagesData);
            log(`--> Migrando ${messageIds.length} mensajes...`);

            if (dryRun) return;

            const messagesPayload = messageIds.map(k => {
                const msg = messagesData[k];
                return {
                    id: k,
                    name: msg.name || 'Anónimo',
                    email: msg.email || null,
                    phone: msg.phone || null,
                    message: msg.message || '',
                    timestamp: msg.timestamp || new Date().toISOString(),
                    read: msg.read || false,
                    archived: msg.archived || false
                };
            });

            const { error } = await sb.from('contact_messages').insert(messagesPayload);
            if (error) log(`Error insertando mensajes: ${error.message}`, 'error');
            else log(`Mensajes insertados correctamente.`);
        }

    </script>
</body>

</html>

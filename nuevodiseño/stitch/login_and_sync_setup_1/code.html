<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CourtSide Sync - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#278cf1",
                        "accent-orange": "#ff5722", /* User requested deep orange */
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .glass-panel {
            background: rgba(16, 25, 34, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        /* Gradient for the orange accent to blend with the blue primary */
        .sport-gradient {
            background: linear-gradient(135deg, #278cf1 0%, #ff5722 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased text-slate-900 dark:text-slate-100 min-h-screen flex flex-col relative overflow-hidden">
<!-- Background Image with Overlay -->
<div class="absolute inset-0 z-0">
<div class="absolute inset-0 bg-background-dark/80 z-10"></div>
<div class="w-full h-full bg-cover bg-center" data-alt="Darkened basketball court floor texture with painted lines" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBeGh-OqF2EBnQpYndDthvty3M5lgKRS69cJoy1BO4nYrHtQVkU74cBqLch34dzByTpBPeib-5vNaoSi4fa4M-papS9Vc0B-NFgoorjKirxQylaRJUATZ04Aivz4u7d1nCCRDf2x4-_jGw_G-hQIFknNCiprMfbnkTZZ3X_JJiqIP1jXZpnXrrq_kNQPCFdh4Y-m1Y0nTNpFx2nerUOBtOQKkh092H8PMpDstrRBabDaUV2Q7MpQL7Ta7Ijpa3dcviDdvvte6pCjyOq');"></div>
</div>
<!-- Main Content Container -->
<div class="relative z-20 flex-1 flex flex-col justify-center items-center w-full px-4 sm:px-6 lg:px-8 py-12">
<!-- Logo & Header Section -->
<div class="w-full max-w-md mx-auto mb-8 text-center animate-fade-in-up">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-background-dark to-slate-800 border border-slate-700 shadow-xl mb-6 relative overflow-hidden group">
<div class="absolute inset-0 bg-accent-orange/10 group-hover:bg-accent-orange/20 transition-colors"></div>
<span class="material-symbols-outlined text-accent-orange text-4xl" style="font-variation-settings: 'FILL' 1;">sports_basketball</span>
</div>
<h1 class="text-3xl md:text-4xl font-bold tracking-tight text-white mb-2">
                CourtSide <span class="text-primary">Sync</span>
</h1>
<p class="text-slate-400 text-base md:text-lg">
                Real-time stats for the next generation.
            </p>
</div>
<!-- Login Card -->
<div class="w-full max-w-md glass-panel rounded-xl shadow-2xl p-6 md:p-8">
<div class="flex flex-col gap-5">
<!-- Email Input -->
<div class="space-y-2">
<label class="block text-sm font-medium text-slate-300" for="email">Email Address</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-slate-500 group-focus-within:text-primary transition-colors">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 bg-background-dark/50 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all" id="email" placeholder="coach@teammail.com" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="block text-sm font-medium text-slate-300" for="password">Password</label>
<a class="text-xs font-medium text-primary hover:text-primary/80 transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-slate-500 group-focus-within:text-primary transition-colors">lock</span>
</div>
<input class="block w-full pl-10 pr-10 py-3 bg-background-dark/50 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all" id="password" placeholder="••••••••" type="password"/>
<div class="absolute inset-y-0 right-0 pr-3 flex items-center cursor-pointer text-slate-500 hover:text-slate-300">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</div>
</div>
</div>
<!-- Login Button -->
<button class="w-full mt-2 flex items-center justify-center py-3.5 px-4 rounded-lg shadow-lg text-white font-semibold bg-primary hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary focus:ring-offset-background-dark transition-all transform active:scale-[0.98]">
                    Sign In
                </button>
<!-- Divider -->
<div class="relative my-2">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-slate-700"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-2 bg-[#151e29] text-slate-400 rounded">Or continue with</span>
</div>
</div>
<!-- Google Button -->
<button class="w-full flex items-center justify-center gap-3 py-3 px-4 rounded-lg bg-white text-slate-900 font-medium hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-white focus:ring-offset-background-dark transition-all transform active:scale-[0.98]">
<svg class="w-5 h-5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                    Google
                </button>
</div>
<!-- Footer Signup Link -->
<div class="mt-8 text-center">
<p class="text-sm text-slate-400">
                    Don't have a team account? 
                    <a class="font-medium text-accent-orange hover:text-accent-orange/80 transition-colors" href="#">Register here</a>
</p>
</div>
</div>
<!-- Real-time Sync Indicator -->
<div class="mt-8 flex items-center justify-center gap-2 px-4 py-2 rounded-full bg-slate-900/60 border border-slate-700/50 backdrop-blur-sm">
<span class="relative flex h-2.5 w-2.5">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
<span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-green-500"></span>
</span>
<span class="text-xs font-medium text-slate-300 tracking-wide uppercase">Live Sync Ready</span>
</div>
</div>
</body></html>

<div class="container py-3">

    <!-- Header -->
    <div class="row align-items-center mb-3">
        <div class="col">
            <h2 class="mb-0">Calendario</h2>
            <p class="text-muted mb-0 small">
                {{ totalThisPeriod }} {{ totalThisPeriod === 1 ? 'partido' : 'partidos' }}
                {{ viewMode === 'week' ? 'en los próximos 7 días' : 'este mes' }}
            </p>
        </div>
        <div class="col-auto">
            <div class="btn-group" role="group">
                <button class="btn btn-sm" [class.btn-primary]="viewMode === 'week'"
                    [class.btn-outline-primary]="viewMode !== 'week'" (click)="setView('week')">
                    <i class="bi bi-calendar-week me-1"></i>Semana
                </button>
                <button class="btn btn-sm" [class.btn-primary]="viewMode === 'month'"
                    [class.btn-outline-primary]="viewMode !== 'month'" (click)="setView('month')">
                    <i class="bi bi-calendar3 me-1"></i>Mes
                </button>
            </div>
        </div>
    </div>

    <!-- Navigation bar -->
    <div class="card mb-3 shadow-sm">
        <div class="card-body py-2">
            <div class="d-flex align-items-center justify-content-between gap-2">
                <button class="btn btn-outline-primary btn-sm" (click)="prevPeriod()">
                    <i class="bi bi-chevron-left"></i> Anterior
                </button>
                <h5 class="mb-0 fw-semibold text-center">{{ periodLabel }}</h5>
                <div class="d-flex gap-2">
                    <button class="btn btn-outline-secondary btn-sm" (click)="goToday()">
                        <i class="bi bi-calendar-check"></i> Hoy
                    </button>
                    <button class="btn btn-outline-primary btn-sm" (click)="nextPeriod()">
                        Siguiente <i class="bi bi-chevron-right"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading -->
    <div *ngIf="loading" class="text-center py-5 text-muted">
        <div class="spinner-border text-primary mb-2" role="status"></div>
        <p>Cargando partidos...</p>
    </div>

    <div *ngIf="errorMsg" class="alert alert-danger">{{ errorMsg }}</div>

    <!-- Week view sub-component -->
    <app-calendar-week-view *ngIf="!loading && viewMode === 'week'" [days]="calDays" (matchClick)="goToMatch($event)">
    </app-calendar-week-view>

    <!-- Month view sub-component -->
    <app-calendar-month-view *ngIf="!loading && viewMode === 'month'" [days]="calDays" (matchClick)="goToMatch($event)">
    </app-calendar-month-view>

    <!-- Empty state -->
    <div *ngIf="!loading && totalThisPeriod === 0" class="text-center text-muted py-5">
        <i class="bi bi-calendar-x fs-1 d-block mb-2"></i>
        No hay partidos en este período
    </div>

</div>

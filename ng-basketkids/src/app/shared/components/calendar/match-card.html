<div class="bg-white dark:bg-surface-dark border border-slate-200 dark:border-white/5 rounded-xl p-3 shadow-md hover:border-primary/30 transition-all cursor-pointer flex flex-col gap-2 h-full"
    (click)="matchClick.emit(match.id)">

    <!-- Header: Time and Action -->
    <div class="flex items-center justify-between">
        <span
            class="text-xs font-semibold text-slate-500 dark:text-slate-400 bg-slate-100 dark:bg-background-dark px-2 py-0.5 rounded-full border border-slate-200 dark:border-white/5">
            <span
                class="material-symbols-outlined text-[12px] inline-block align-text-bottom mr-1 mr-0.5">schedule</span>
            {{ formatTime(match.date || '') }}
        </span>
        <button
            class="h-6 w-6 flex items-center justify-center rounded-full bg-primary/10 text-primary hover:bg-primary hover:text-white transition-colors"
            title="Ver detalle" (click)="matchClick.emit(match.id); $event.stopPropagation()">
            <span class="material-symbols-outlined text-[14px]">chevron_right</span>
        </button>
    </div>

    <!-- Teams -->
    <div class="flex flex-col flex-1 justify-center py-1">
        <div class="flex items-center gap-2">
            <div class="w-2 h-2 rounded-full"
                [ngClass]="match.isLocal ? 'bg-primary' : 'bg-slate-300 dark:bg-slate-600'"></div>
            <span class="text-slate-800 dark:text-white font-medium text-sm truncate" [title]="localName">{{ localName
                }}</span>
        </div>
        <div class="pl-4 border-l border-slate-200 dark:border-white/5 ml-1 py-1">
            <span class="text-xs text-slate-400 dark:text-slate-500 font-medium">vs</span>
        </div>
        <div class="flex items-center gap-2">
            <div class="w-2 h-2 rounded-full"
                [ngClass]="!match.isLocal ? 'bg-primary' : 'bg-slate-300 dark:bg-slate-600'"></div>
            <span class="text-slate-800 dark:text-white font-medium text-sm truncate" [title]="visitorName">{{
                visitorName }}</span>
        </div>
    </div>

    <!-- Footer: Location & Status -->
    <div class="flex items-center justify-between border-t border-slate-200 dark:border-white/5 pt-2 mt-auto">
        <!-- Location -->
        <a *ngIf="match.location" [href]="mapsUrl" target="_blank" (click)="$event.stopPropagation()"
            class="text-[11px] text-slate-500 dark:text-slate-400 hover:text-primary transition-colors flex items-center gap-1 max-w-[60%] truncate"
            title="{{ match.location }}">
            <span class="material-symbols-outlined text-[12px] shrink-0">location_on</span>
            <span class="truncate">{{ match.location }}</span>
        </a>
        <span *ngIf="!match.location" class="text-[11px] text-slate-400 dark:text-slate-500 flex items-center gap-1">
            <span class="material-symbols-outlined text-[12px]">location_off</span> Sin pabellón
        </span>

        <!-- Status & Score -->
        <div class="flex items-center gap-1.5 shrink-0">
            <ng-container [ngSwitch]="normalizedState">
                <span *ngSwitchCase="'pendiente'"
                    class="material-symbols-outlined text-[14px] text-slate-500 dark:text-slate-400"
                    title="Pendiente">schedule</span>
                <span *ngSwitchCase="'en_curso'" class="flex h-2 w-2 relative" title="En curso">
                    <span
                        class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2 w-2 bg-red-500"></span>
                </span>
                <span *ngSwitchCase="'finalizado'" class="material-symbols-outlined text-[14px] text-green-500"
                    title="Finalizado">check_circle</span>
                <span *ngSwitchDefault
                    class="material-symbols-outlined text-[14px] text-slate-400 dark:text-slate-500">help</span>
            </ng-container>

            <span *ngIf="hasScore"
                class="text-xs font-bold px-1.5 py-0.5 rounded-md bg-slate-100 dark:bg-white/5 border border-slate-200 dark:border-white/5"
                [ngClass]="{'text-green-600 dark:text-green-400': localScore > visitorScore, 'text-red-600 dark:text-red-400': localScore < visitorScore, 'text-slate-500 dark:text-slate-300': localScore === visitorScore}">
                {{ localScore }} - {{ visitorScore }}
            </span>
        </div>
    </div>
</div>

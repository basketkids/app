<!-- Bootstrap responsive row: 1 col mobile, 2 md, 3 lg, 4 xl — same as old/public/index.html -->
<div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 row-cols-xl-4 g-3">
    <div *ngFor="let day of days" class="col day-column">
        <div class="card h-100 border-0 bg-transparent">
            <!-- Day header: weekday left, day number right -->
            <div class="card-header p-2 d-flex justify-content-between align-items-center rounded-top"
                [class.bg-primary]="!day.isToday" [class.bg-warning]="day.isToday" [class.text-white]="!day.isToday"
                [class.text-dark]="day.isToday">
                <span class="text-uppercase fw-bold small">{{ day.weekday }}</span>
                <span class="fs-5 fw-bold">{{ day.dayNum }}</span>
            </div>
            <!-- Matches -->
            <div class="card-body p-0 pt-2 matches-container">
                <div *ngIf="day.matches.length === 0" class="text-muted text-center small py-3">
                    Sin partidos
                </div>
                <app-match-card *ngFor="let m of day.matches" [match]="m" (matchClick)="matchClick.emit($event)">
                </app-match-card>
            </div>
        </div>
    </div>
</div>

<nav *ngIf="auth.isLoggedIn()"
    class="flex flex-none shrink-0 border-t border-white/10 bg-surface-dark pb-6 pt-2 px-6 justify-around w-full z-50 mt-auto">
    <a routerLink="/home" routerLinkActive="!text-primary [&>span]:!text-primary"
        class="flex flex-col items-center justify-center gap-1 text-gray-500 hover:text-gray-300 transition-colors group no-underline w-16">
        <span class="material-symbols-outlined text-[24px] group-hover:scale-110 transition-transform">home</span>
        <span class="text-[10px] font-medium">Inicio</span>
    </a>
    <!-- Reusing competitions for matches list -->
    <a routerLink="/home" [queryParams]="{tab: 'competitions'}" routerLinkActive="!text-primary [&>span]:!text-primary"
        class="flex flex-col items-center justify-center gap-1 text-gray-500 hover:text-gray-300 transition-colors group no-underline w-16">
        <span
            class="material-symbols-outlined text-[24px] group-hover:scale-110 transition-transform">calendar_month</span>
        <span class="text-[10px] font-medium">Partidos</span>
    </a>
    <a routerLink="/perfil" routerLinkActive="!text-primary [&>span]:!text-primary"
        class="flex flex-col items-center justify-center gap-1 text-gray-500 hover:text-gray-300 transition-colors group no-underline w-16">
        <span class="material-symbols-outlined text-[24px] group-hover:scale-110 transition-transform">person</span>
        <span class="text-[10px] font-medium">Perfil</span>
    </a>
</nav>

<div
  class="flex flex-col h-screen max-h-[100dvh] w-full overflow-hidden bg-background-light dark:bg-background-dark text-slate-800 dark:text-white font-display">
  <!-- Top Header (Hidden on Login Page) -->
  <app-header *ngIf="!isLoginPage"></app-header>

  <!-- Main Scrollable Content Area -->
  <main class="flex-1 overflow-x-hidden overflow-y-auto relative outline-none flex flex-col items-center w-full">
    <div class="w-full max-w-4xl mx-auto flex-1 flex flex-col pt-4">
      <router-outlet></router-outlet>
    </div>
    <app-footer *ngIf="!isLoginPage"></app-footer>
  </main>

  <!-- Bottom Navigation (Hidden on Login Page) -->
  <app-bottom-nav *ngIf="!isLoginPage" class="md:hidden"></app-bottom-nav>
</div>

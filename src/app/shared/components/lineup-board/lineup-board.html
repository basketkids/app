<div
    class="relative w-full aspect-[4/3] bg-emerald-900 rounded-2xl overflow-hidden border-4 border-slate-700 shadow-2xl p-4 flex flex-col items-center">
    <!-- Header/Title -->
    <div class="absolute top-4 left-6 flex flex-col">
        <h3 class="text-white/40 text-[10px] uppercase font-black tracking-widest">{{ title }}</h3>
        <div class="flex items-center gap-3">
            <div class="flex flex-col">
                <span class="text-white text-3xl font-black tabular-nums leading-none"
                    [ngClass]="{'text-green-400': (stats?.diff || 0) > 0, 'text-red-400': (stats?.diff || 0) < 0}">
                    {{ (stats?.diff || 0) > 0 ? '+' : '' }}{{ stats?.diff || 0 }}
                </span>
                <span class="text-white/30 text-[9px] uppercase font-bold tracking-tighter">Plus/Minus</span>
            </div>
            <div class="w-px h-6 bg-white/10 mx-1"></div>
            <div class="flex flex-col">
                <span class="text-white/80 text-lg font-bold tabular-nums leading-none">{{ stats?.pointsFor || 0 }} - {{
                    stats?.pointsAgainst || 0 }}</span>
                <span class="text-white/30 text-[9px] uppercase font-bold tracking-tighter">Score</span>
            </div>
        </div>
    </div>

    <!-- Basketball Court SVG Background -->
    <div class="absolute inset-0 opacity-20 pointer-events-none p-6">
        <svg viewBox="0 0 100 100" class="w-full h-full text-white fill-none stroke-current" stroke-width="1.5">
            <!-- Half Court -->
            <rect x="0" y="0" width="100" height="100" rx="2" />
            <!-- Paint -->
            <rect x="30" y="0" width="40" height="35" />
            <circle cx="50" cy="35" r="8" />
            <!-- Three point line -->
            <path d="M 0 45 Q 50 100 100 45" />
            <!-- Hoop -->
            <circle cx="50" cy="5" r="2" />
        </svg>
    </div>

    <!-- Players Positions -->
    <div class="relative w-full h-full mt-8">
        <div *ngFor="let p of players; let i = index"
            class="absolute -translate-x-1/2 -translate-y-1/2 flex flex-col items-center transition-all duration-700 ease-out animate-in fade-in zoom-in"
            [style.top]="positions[i].top" [style.left]="positions[i].left">

            <div class="relative group cursor-help">
                <app-avatar [playerId]="p.id" [seed]="p.id" [config]="p.avatarConfig" [jerseyColor]="jerseyColor"
                    [size]="56"
                    class="block rounded-full border-2 border-white/20 shadow-lg group-hover:scale-110 transition-transform">
                </app-avatar>
                <!-- Badge Dorsal -->
                <div
                    class="absolute -bottom-1 -right-1 bg-white text-emerald-900 text-[10px] font-black w-5 h-5 rounded-full flex items-center justify-center border-2 border-emerald-900 shadow-sm">
                    {{ p.dorsal }}
                </div>
            </div>
            <span
                class="mt-2 text-[10px] font-black text-white/90 bg-black/40 px-2 py-0.5 rounded backdrop-blur-sm truncate max-w-[70px]">
                {{ p.name.split(' ')[0] }}
            </span>
        </div>
    </div>
</div>

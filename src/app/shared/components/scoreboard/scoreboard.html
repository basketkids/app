<div
    class="relative overflow-hidden rounded-2xl border border-slate-200 bg-white p-4 shadow-lg dark:border-slate-700 dark:bg-surface-dark">
    <!-- Live Pulse Indicator -->
    <div *ngIf="timerState.active"
        class="absolute right-3 top-3 flex items-center gap-1.5 rounded-full border border-red-500/20 bg-red-500/10 px-2 py-0.5 dark:bg-red-500/20">
        <span class="relative flex h-2 w-2">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-500 opacity-75"></span>
            <span class="relative inline-flex h-2 w-2 rounded-full bg-red-500"></span>
        </span>
        <span class="text-[10px] font-bold uppercase tracking-wider text-red-600 dark:text-red-400">Live</span>
    </div>

    <!-- Teams & Score -->
    <div class="flex items-center justify-between pt-2">
        <!-- Home Team -->
        <div class="flex flex-1 flex-col items-center">
            <div
                class="mb-2 flex h-12 w-12 items-center justify-center rounded-full bg-primary/10 text-primary dark:bg-primary/20">
                <span class="material-symbols-outlined text-2xl">sports_basketball</span>
            </div>
            <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">{{ localName
                }}</h3>
            <p class="text-4xl font-black text-slate-900 dark:text-white">{{ localScore }}</p>
            <!-- Bonus Indicators -->
            <div class="mt-2 flex gap-1">
                <div *ngFor="let i of [1,2,3,4]" class="h-1.5 w-1.5 rounded-full transition-colors"
                    [ngClass]="localFouls >= i ? 'bg-red-500 shadow-[0_0_8px_rgba(239,68,68,0.8)]' : 'bg-slate-200 dark:bg-slate-700'">
                </div>
                <span *ngIf="localFouls >= 4"
                    class="ml-1 text-[8px] font-black text-red-500 uppercase animate-pulse">Bonus</span>
            </div>
        </div>

        <!-- Clock & Period -->
        <div class="flex w-28 flex-col items-center justify-center">
            <div class="mb-1 text-[10px] font-bold uppercase tracking-[0.2em] text-slate-400 dark:text-slate-500">
                Periodo</div>
            <div class="mb-2 rounded-lg bg-slate-100 px-4 py-1.5 dark:bg-slate-800">
                <span class="text-xl font-black text-slate-800 dark:text-slate-200">Q{{ quarter }}</span>
            </div>
            <p class="font-mono text-3xl font-bold tracking-tighter text-primary">{{ formattedTime }}</p>
        </div>

        <!-- Guest Team -->
        <div class="flex flex-1 flex-col items-center">
            <div
                class="mb-2 flex h-12 w-12 items-center justify-center rounded-full bg-slate-100 text-slate-400 dark:bg-slate-700 dark:text-slate-500">
                <span class="material-symbols-outlined text-2xl">sports_basketball</span>
            </div>
            <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">{{ visitorName
                }}</h3>
            <p class="text-4xl font-black text-slate-900 dark:text-white">{{ visitorScore }}</p>
            <!-- Bonus Indicators -->
            <div class="mt-2 flex gap-1">
                <div *ngFor="let i of [1,2,3,4]" class="h-1.5 w-1.5 rounded-full transition-colors"
                    [ngClass]="visitorFouls >= i ? 'bg-red-500 shadow-[0_0_8px_rgba(239,68,68,0.8)]' : 'bg-slate-200 dark:bg-slate-700'">
                </div>
                <span *ngIf="visitorFouls >= 4"
                    class="ml-1 text-[8px] font-black text-red-500 uppercase animate-pulse">Bonus</span>
            </div>
        </div>
    </div>
</div>

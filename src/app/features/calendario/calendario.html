<div class="relative flex h-full min-h-screen w-full flex-col overflow-hidden max-w-md md:max-w-4xl lg:max-w-6xl
xl:max-w-[1400px] mx-auto border-x border-gray-200 dark:border-white/10 bg-white dark:bg-background-dark">

    <!-- Header -->
    <div
        class="sticky top-0 z-20 bg-white/95 dark:bg-background-dark/95 backdrop-blur-md border-b border-gray-200 dark:border-white/10 pb-4">
        <div class="flex items-center justify-between px-4 pt-6 pb-2">
            <h1 class="text-3xl font-bold tracking-tight text-slate-800 dark:text-white">Calendario</h1>
        </div>
        <div class="px-4 text-sm text-slate-500 dark:text-slate-400">
            {{ totalThisPeriod }} {{ totalThisPeriod === 1 ? 'partido' : 'partidos' }}
            {{ viewMode === 'week' ? 'en los próximos 7 días' : 'este mes' }}
        </div>
    </div>

    <!-- Main Content -->
    <div class="flex-1 overflow-y-auto pb-24 space-y-4">

        <!-- Controls Layout -->
        <div class="px-4 pt-4 flex flex-col gap-4">

            <!-- View Toggle -->
            <div
                class="flex bg-slate-100 dark:bg-surface-dark border border-slate-200 dark:border-white/10 rounded-xl p-1 w-full max-w-[200px]">
                <button
                    [ngClass]="{'bg-primary text-white shadow-sm': viewMode === 'week', 'text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-white': viewMode !== 'week'}"
                    (click)="setView('week')"
                    class="flex-1 flex items-center justify-center gap-1 py-1.5 text-sm font-medium rounded-lg transition-all">
                    <span class="material-symbols-outlined text-[18px]">calendar_view_week</span> Semana
                </button>
                <button
                    [ngClass]="{'bg-primary text-white shadow-sm': viewMode === 'month', 'text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-white': viewMode !== 'month'}"
                    (click)="setView('month')"
                    class="flex-1 flex items-center justify-center gap-1 py-1.5 text-sm font-medium rounded-lg transition-all">
                    <span class="material-symbols-outlined text-[18px]">calendar_month</span> Mes
                </button>
            </div>

            <!-- Period Navigation -->
            <div
                class="flex items-center justify-between bg-white dark:bg-surface-dark border border-gray-200 dark:border-white/10 rounded-xl p-2 shadow-sm">
                <button (click)="prevPeriod()"
                    class="h-10 w-10 flex items-center justify-center rounded-lg text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-white/5 hover:text-slate-800 dark:hover:text-white transition-colors">
                    <span class="material-symbols-outlined">chevron_left</span>
                </button>

                <div class="flex flex-col items-center flex-1">
                    <span class="text-sm font-semibold text-slate-800 dark:text-white tracking-wide uppercase">{{
                        periodLabel }}</span>
                    <button (click)="goToday()"
                        class="text-xs font-medium text-primary hover:text-orange-400 transition-colors mt-0.5">Volver a
                        Hoy</button>
                </div>

                <button (click)="nextPeriod()"
                    class="h-10 w-10 flex items-center justify-center rounded-lg text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-white/5 hover:text-slate-800 dark:hover:text-white transition-colors">
                    <span class="material-symbols-outlined">chevron_right</span>
                </button>
            </div>
        </div>


        <div *ngIf="loading" class="flex flex-col justify-center items-center py-12 text-slate-500 dark:text-slate-400">
            <span class="material-symbols-outlined animate-spin text-primary text-[32px] mb-2">progress_activity</span>
            <span class="text-sm">Cargando partidos...</span>
        </div>

        <div *ngIf="errorMsg"
            class="mx-4 p-3 text-sm text-red-500 bg-red-50 border border-red-200 dark:text-red-400 dark:bg-red-900/20 dark:border-red-900/50 rounded-lg">
            {{ errorMsg }}
        </div>

        <!-- Calendar Views -->
        <div class="px-4" *ngIf="!loading">
            <!-- Empty state -->
            <div *ngIf="totalThisPeriod === 0"
                class="flex flex-col items-center justify-center py-16 text-slate-500 dark:text-slate-500 bg-slate-50 dark:bg-surface-dark/50 rounded-2xl border border-slate-200 dark:border-white/5 border-dashed">
                <span class="material-symbols-outlined text-4xl mb-3 opacity-50">event_busy</span>
                <span class="text-sm font-medium">No hay partidos en este período</span>
            </div>

            <!-- Subcomponents -->
            <app-calendar-week-view *ngIf="viewMode === 'week' && totalThisPeriod > 0" [days]="calDays"
                (matchClick)="goToMatch($event)">
            </app-calendar-week-view>

            <app-calendar-month-view *ngIf="viewMode === 'month' && totalThisPeriod > 0" [days]="calDays"
                (matchClick)="goToMatch($event)">
            </app-calendar-month-view>
        </div>

    </div>
</div>

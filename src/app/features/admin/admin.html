<div class="p-4 max-w-5xl mx-auto pb-20">

    <!-- Header -->
    <div class="flex items-center justify-between mb-6">
        <div class="flex items-center gap-3">
            <span class="material-symbols-outlined text-primary text-3xl">admin_panel_settings</span>
            <h1 class="text-2xl font-bold text-slate-800 dark:text-white">Panel de Administración</h1>
        </div>
        <div class="flex gap-2">
            <a routerLink="/admin/messages"
                class="flex items-center gap-2 px-4 py-2 rounded-xl bg-white dark:bg-surface-dark border border-gray-200 dark:border-white/10 text-slate-700 dark:text-gray-200 text-sm font-medium hover:bg-slate-50 dark:hover:bg-white/5 transition-colors shadow-sm">
                <span class="material-symbols-outlined text-[20px]">mail</span> Mensajes
            </a>
            <a routerLink="/admin/stats"
                class="flex items-center gap-2 px-4 py-2 rounded-xl bg-primary text-white text-sm font-medium hover:bg-orange-600 transition-colors shadow-sm">
                <span class="material-symbols-outlined text-[20px]">bar_chart</span> Estadísticas
            </a>
        </div>
    </div>

    <!-- Error -->
    <div *ngIf="error" class="mb-4 p-3 rounded-xl bg-red-50 dark:bg-red-500/10 text-red-600 dark:text-red-400 text-sm">
        {{ error }}</div>

    <!-- Users Table Card -->
    <div
        class="bg-white dark:bg-surface-dark border border-gray-200 dark:border-white/10 rounded-2xl shadow-sm overflow-hidden">
        <div class="px-5 py-4 border-b border-gray-100 dark:border-white/5">
            <h2 class="font-bold text-slate-800 dark:text-white">Gestión de Usuarios</h2>
        </div>

        <!-- Loading -->
        <div *ngIf="loading" class="flex justify-center p-12">
            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-primary"></div>
        </div>

        <!-- Table -->
        <div *ngIf="!loading" class="overflow-x-auto">
            <table class="w-full text-sm">
                <thead class="bg-slate-50 dark:bg-white/5">
                    <tr>
                        <th class="text-left font-semibold text-slate-500 dark:text-slate-400 px-5 py-3">Usuario</th>
                        <th
                            class="text-left font-semibold text-slate-500 dark:text-slate-400 px-5 py-3 hidden md:table-cell">
                            Email</th>
                        <th class="text-center font-semibold text-slate-500 dark:text-slate-400 px-5 py-3">Admin</th>
                        <th class="text-right font-semibold text-slate-500 dark:text-slate-400 px-5 py-3">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let user of users"
                        class="border-t border-gray-100 dark:border-white/5 hover:bg-slate-50 dark:hover:bg-white/5 transition-colors">
                        <td class="px-5 py-3">
                            <div class="flex items-center gap-3">
                                <img [src]="getAvatar(user)"
                                    class="w-9 h-9 rounded-full bg-white border border-gray-100 dark:border-white/5 object-cover"
                                    alt="">
                                <div>
                                    <!-- Editing mode -->
                                    <div *ngIf="editingUserId === user.id" class="flex items-center gap-2">
                                        <input [(ngModel)]="editingName" (keydown.enter)="saveEditName()"
                                            (keydown.escape)="cancelEdit()"
                                            class="text-sm border border-primary rounded-lg px-2 py-1 bg-white dark:bg-background-dark text-slate-800 dark:text-white focus:outline-none"
                                            autofocus>
                                        <button (click)="saveEditName()"
                                            class="p-1 text-green-500 hover:text-green-600"><span
                                                class="material-symbols-outlined text-[18px]">check</span></button>
                                        <button (click)="cancelEdit()"
                                            class="p-1 text-slate-400 hover:text-slate-600"><span
                                                class="material-symbols-outlined text-[18px]">close</span></button>
                                    </div>
                                    <!-- Display mode -->
                                    <div *ngIf="editingUserId !== user.id">
                                        <span class="font-semibold text-slate-800 dark:text-white">{{ user.display_name
                                            || 'Sin nombre' }}</span>
                                    </div>
                                    <div class="text-xs text-slate-400 font-mono">{{ user.id.substring(0,8) }}...</div>
                                </div>
                            </div>
                        </td>
                        <td class="px-5 py-3 text-slate-500 dark:text-slate-400 hidden md:table-cell">{{ user.email ??
                            '—' }}</td>
                        <td class="px-5 py-3 text-center">
                            <span *ngIf="user.is_admin"
                                class="inline-block px-2 py-0.5 rounded-full text-xs font-bold bg-primary/10 text-primary">Sí</span>
                            <span *ngIf="!user.is_admin"
                                class="inline-block px-2 py-0.5 rounded-full text-xs font-bold bg-gray-100 dark:bg-white/10 text-slate-500">No</span>
                        </td>
                        <td class="px-5 py-3">
                            <div class="flex gap-1.5 justify-end">
                                <!-- Toggle Admin -->
                                <button (click)="toggleAdmin(user)" [disabled]="isCurrentUser(user.id)"
                                    class="px-2.5 py-1 rounded-lg text-xs font-medium border transition-colors disabled:opacity-40"
                                    [ngClass]="user.is_admin ? 'border-red-300 text-red-500 hover:bg-red-50 dark:hover:bg-red-500/10' : 'border-primary text-primary hover:bg-primary/5'">
                                    {{ user.is_admin ? 'Quitar Admin' : 'Hacer Admin' }}
                                </button>
                                <!-- Edit Name -->
                                <button (click)="startEditName(user)"
                                    class="p-1.5 rounded-lg border border-gray-200 dark:border-white/10 text-slate-500 hover:bg-slate-50 dark:hover:bg-white/5 transition-colors">
                                    <span class="material-symbols-outlined text-[16px]">edit</span>
                                </button>
                                <!-- Delete -->
                                <button (click)="deleteUser(user)" [disabled]="user.is_admin || isCurrentUser(user.id)"
                                    class="p-1.5 rounded-lg border border-red-200 dark:border-red-400/20 text-red-500 hover:bg-red-50 dark:hover:bg-red-500/10 transition-colors disabled:opacity-30">
                                    <span class="material-symbols-outlined text-[16px]">delete</span>
                                </button>
                            </div>
                        </td>
                    </tr>
                    <tr *ngIf="users.length === 0">
                        <td colspan="4" class="text-center py-10 text-slate-400">No hay usuarios registrados.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

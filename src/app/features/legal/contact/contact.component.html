<div class="container my-5 flex-grow-1 p-4 max-w-2xl mx-auto">
    <div class="bg-white dark:bg-surface-dark border border-gray-200 dark:border-white/10 rounded-2xl shadow-sm">
        <div class="p-6">
            <div class="text-center mb-6">
                <h3 class="text-2xl font-bold text-primary mb-2">Contáctanos</h3>
                <p class="text-slate-500 dark:text-slate-400">Envíanos tus dudas o sugerencias</p>
            </div>

            <form>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Nombre *</label>
                    <input type="text" required
                        class="w-full bg-slate-50 dark:bg-background-dark border border-slate-300 dark:border-white/10 rounded-xl px-4 py-3 text-slate-800 dark:text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Email *</label>
                    <input type="email" required
                        class="w-full bg-slate-50 dark:bg-background-dark border border-slate-300 dark:border-white/10 rounded-xl px-4 py-3 text-slate-800 dark:text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Teléfono
                        (opcional)</label>
                    <input type="tel"
                        class="w-full bg-slate-50 dark:bg-background-dark border border-slate-300 dark:border-white/10 rounded-xl px-4 py-3 text-slate-800 dark:text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors">
                </div>
                <div class="mb-6">
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Mensaje *</label>
                    <textarea rows="5" required
                        class="w-full bg-slate-50 dark:bg-background-dark border border-slate-300 dark:border-white/10 rounded-xl px-4 py-3 text-slate-800 dark:text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors resize-y min-h-[120px]"></textarea>
                </div>
                <div class="flex justify-end">
                    <button type="button"
                        class="w-full py-3.5 rounded-xl font-bold bg-primary text-white shadow-lg shadow-primary/20 hover:bg-orange-600 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                        <span class="material-symbols-outlined text-[18px]">send</span> Enviar Mensaje
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

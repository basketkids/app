<div class="p-4 max-w-2xl mx-auto pb-20">
    <div class="bg-white dark:bg-surface-dark border border-gray-200 dark:border-white/10 rounded-2xl shadow-sm">
        <div class="p-6">
            <div class="text-center mb-6">
                <h1 class="text-2xl font-bold text-primary mb-2">Contáctanos</h1>
                <p class="text-slate-500 dark:text-slate-400">Envíanos tus dudas o sugerencias</p>
            </div>

            <!-- Success message -->
            <div *ngIf="success"
                class="mb-6 p-4 rounded-xl bg-green-50 dark:bg-green-500/10 border border-green-200 dark:border-green-500/20 text-green-700 dark:text-green-400 text-sm flex items-center gap-2">
                <span class="material-symbols-outlined text-[20px]">check_circle</span>
                ¡Mensaje enviado! Te responderemos lo antes posible.
            </div>

            <!-- Error message -->
            <div *ngIf="error"
                class="mb-4 p-3 rounded-xl bg-red-50 dark:bg-red-500/10 text-red-600 dark:text-red-400 text-sm">{{ error
                }}</div>

            <form *ngIf="!success" (ngSubmit)="send()">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Nombre *</label>
                    <input type="text" [(ngModel)]="form.name" name="name" required
                        class="w-full bg-slate-50 dark:bg-background-dark border border-slate-300 dark:border-white/10 rounded-xl px-4 py-3 text-slate-800 dark:text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Email *</label>
                    <input type="email" [(ngModel)]="form.email" name="email" required
                        class="w-full bg-slate-50 dark:bg-background-dark border border-slate-300 dark:border-white/10 rounded-xl px-4 py-3 text-slate-800 dark:text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Teléfono <span
                            class="text-slate-400">(opcional)</span></label>
                    <input type="tel" [(ngModel)]="form.phone" name="phone"
                        class="w-full bg-slate-50 dark:bg-background-dark border border-slate-300 dark:border-white/10 rounded-xl px-4 py-3 text-slate-800 dark:text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors">
                </div>
                <div class="mb-6">
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Mensaje *</label>
                    <textarea rows="5" [(ngModel)]="form.message" name="message" required
                        class="w-full bg-slate-50 dark:bg-background-dark border border-slate-300 dark:border-white/10 rounded-xl px-4 py-3 text-slate-800 dark:text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors resize-y min-h-[120px]"></textarea>
                </div>
                <button type="submit" [disabled]="sending"
                    class="w-full py-3.5 rounded-xl font-bold bg-primary text-white shadow-lg shadow-primary/20 hover:bg-orange-600 active:scale-[0.98] transition-all flex items-center justify-center gap-2 disabled:opacity-60">
                    <span *ngIf="!sending" class="material-symbols-outlined text-[18px]">send</span>
                    <span *ngIf="sending"
                        class="animate-spin material-symbols-outlined text-[18px]">progress_activity</span>
                    {{ sending ? 'Enviando...' : 'Enviar Mensaje' }}
                </button>
            </form>
        </div>
    </div>
</div>
